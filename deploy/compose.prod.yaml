services:
  staffdeck:
    image: ${STAFFDECK_IMAGE:-ghcr.io/hnscdg/staffdeck:latest}
    container_name: staffdeck
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    env_file:
      - .env
    volumes:
      - /opt/staffdeck/data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:5173/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
